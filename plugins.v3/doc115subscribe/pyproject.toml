[project]
name = "moviepilot-plugin-doc115subscribe"
dynamic = ["version"]
requires-python = ">=3.12"
# MoviePilot 的依赖清单是「二选一」而不是合并：
# 只要本文件存在，插件目录下的 requirements.txt 会被完全忽略，所以这里必须写全。
#
# 说明：
#  - 读取腾讯文档只用到 Python 标准库（urllib / zlib / base64），无需额外依赖；
#  - p115client 用于 115 分享转存与 115 离线下载（磁力 / ed2k）；
#  - python-concurrenttools 必须锁 0.1.8：0.1.9 起不再提供 p115client 依赖的
#    threadpool_map / taskgroup_map，装上会让 115 相关调用失效。
dependencies = [
    "p115client==0.0.9.6.5.1",
    "python-concurrenttools==0.1.8",
]
